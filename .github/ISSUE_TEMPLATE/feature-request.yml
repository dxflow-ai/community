name: ✨ Feature Request
description: Suggest an idea or improvement for the dxflow engine, CLI, or installer.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
    - type: markdown
      attributes:
          value: |
              Thanks for sharing an idea! Please describe what you'd like and why it would be useful.

              **This tracker covers the dxflow engine, CLI, installer, releases, and licensing.** Requests for the web console, hub templates, and documentation live in their own repos — see the links on the [new issue chooser](https://github.com/dxflow-ai/community/issues/new/choose).
    - type: checkboxes
      id: preflight
      attributes:
          label: Before you start
          options:
              - label: I have searched the [existing issues](https://github.com/dxflow-ai/community/issues) and this hasn't been requested yet.
                required: true
    - type: dropdown
      id: component
      attributes:
          label: Component
          description: Which part of dxflow would this affect?
          options:
              - Installation (install.sh)
              - Engine — boot / daemon
              - Engine — workflows
              - Engine — artifacts / files
              - Engine — shell sessions
              - Engine — proxy / bridge / tunneling
              - Engine — config
              - Authentication / keys
              - Licensing
              - CLI — general
              - Releases / prebuilt binaries
              - Other / not sure
      validations:
          required: true
    - type: textarea
      id: problem
      attributes:
          label: Problem / motivation
          description: What problem are you trying to solve? Is your request related to a frustration or limitation?
          placeholder: "I'm always frustrated when ..."
      validations:
          required: true
    - type: textarea
      id: solution
      attributes:
          label: Proposed solution
          description: A clear and concise description of what you want to happen.
      validations:
          required: true
    - type: textarea
      id: alternatives
      attributes:
          label: Alternatives considered
          description: Any alternative solutions or workarounds you've considered.
      validations:
          required: false
    - type: textarea
      id: context
      attributes:
          label: Additional context
          description: Add any other context, mockups, or screenshots about the request here.
      validations:
          required: false
